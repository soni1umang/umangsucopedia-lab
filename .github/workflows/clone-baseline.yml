name: Clone stable Ucopedia v2 baseline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy stable v2
        run: |
          rm -rf /tmp/ucopedia-v2
          git clone --depth 1 https://github.com/soni1umang/umangsucopedia-v2.git /tmp/ucopedia-v2
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/deploy.yml' /tmp/ucopedia-v2/ ./

      - name: Commit baseline into Lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clone stable Ucopedia v2 baseline" || exit 0
          git push origin main
